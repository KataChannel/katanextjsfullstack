# ============================================
# Docker Compose for InnerBright Website
# Next.js Application
# ============================================

version: '3.8'

services:
  # InnerBright Next.js Application
  innerbright-web:
    image: innerbright-web:latest
    container_name: innerbright-web
    restart: unless-stopped
    environment:
      # Node Environment
      NODE_ENV: production
      PORT: 3005
      HOSTNAME: 0.0.0.0
      
      # Database
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/innerv2core
      
      # Prisma
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
      PRISMA_HIDE_PREVIEW_FEATURES_WARNING: "true"
      
      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://innerbright.vn}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      
      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: "false"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_NAME: "InnerBright Training & Coaching"
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-info@innerbright.vn}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      
      # MinIO
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: innerbright
      
      # App Info
      NEXT_PUBLIC_APP_NAME: InnerBright
      NEXT_PUBLIC_APP_URL: ${NEXTAUTH_URL:-https://innerbright.vn}
      NEXT_PUBLIC_DOMAIN: innerbright.vn
      
    ports:
      - "3005:3005"
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - innerbright-network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  innerbright-network:
    name: innerbright-network
    external: true
