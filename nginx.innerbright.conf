# ============================================
# Nginx Configuration for InnerBright.vn
# Location: /etc/nginx/sites-available/innerbright.vn
# ============================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name innerbright.vn www.innerbright.vn;
    
    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    
    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name innerbright.vn www.innerbright.vn;

    # SSL certificates (will be managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/innerbright.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innerbright.vn/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/innerbright.vn/chain.pem;
    
    # SSL configuration (Modern, Secure)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    # SSL session
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logs
    access_log /var/log/nginx/innerbright.vn.access.log;
    error_log /var/log/nginx/innerbright.vn.error.log warn;

    # Max upload size
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    
    # Buffer sizes
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Proxy to Next.js application
    location / {
        proxy_pass http://localhost:3005;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Bypass cache for upgrades
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
    }
    
    # Static files - Cache for performance
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache static files
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Next.js specific paths
    location /_next/static/ {
        proxy_pass http://localhost:3005;
        proxy_set_header Host $host;
        
        # Cache Next.js static files
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Health check endpoint (bypass logging)
    location /api/health {
        proxy_pass http://localhost:3005;
        proxy_set_header Host $host;
        access_log off;
    }
}

# ============================================
# Installation Instructions:
# ============================================
# 1. Copy this file to Nginx sites-available:
#    sudo cp nginx.innerbright.conf /etc/nginx/sites-available/innerbright.vn
#
# 2. Create Let's Encrypt directory:
#    sudo mkdir -p /var/www/letsencrypt
#
# 3. Enable the site:
#    sudo ln -s /etc/nginx/sites-available/innerbright.vn /etc/nginx/sites-enabled/
#
# 4. Test Nginx configuration:
#    sudo nginx -t
#
# 5. Reload Nginx:
#    sudo systemctl reload nginx
#
# 6. Get SSL certificate (First time only):
#    sudo certbot --nginx -d innerbright.vn -d www.innerbright.vn
#
# 7. Test SSL renewal:
#    sudo certbot renew --dry-run
#
# ============================================
# Maintenance:
# ============================================
# View access logs:
#   sudo tail -f /var/log/nginx/innerbright.vn.access.log
#
# View error logs:
#   sudo tail -f /var/log/nginx/innerbright.vn.error.log
#
# Test config:
#   sudo nginx -t
#
# Reload (no downtime):
#   sudo systemctl reload nginx
#
# Restart:
#   sudo systemctl restart nginx
#
# Check status:
#   sudo systemctl status nginx
